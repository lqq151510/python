name: Test Backend

on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      - name: Export CI placeholders
        run: bash scripts/ci-env.sh >> "$GITHUB_ENV"
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db mailpit
      - name: Create isolated test database
        run: |
          test_db="devassist_test_$(python -c 'import secrets; print(secrets.token_hex(6))')"
          docker compose exec -T db createdb -U postgres "$test_db"
          echo "DEVASSIST_TEST_DATABASE=$test_db" >> "$GITHUB_ENV"
          echo "DATABASE_URL=${DATABASE_URL%/*}/$test_db" >> "$GITHUB_ENV"
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Gate fixed RAG retrieval evaluation
        run: uv run python scripts/evaluate-retrieval.py --gate ../examples/retrieval-eval-gate.json --json-output /tmp/devassist-retrieval-eval.json --report /tmp/devassist-retrieval-eval.md
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        # The floor lives in backend/pyproject.toml ([tool.coverage.report]
        # fail_under), so a local `coverage report` enforces the same number.
        run: uv run coverage report
        working-directory: backend
